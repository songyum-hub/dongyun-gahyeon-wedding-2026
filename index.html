<style>
  :root{
    --ink:#2b2622;
    --paper:#faeef0;
    --paper-soft:#f4e1e4;
    --wine:#b06b78;
    --wine-deep:#8f4d5a;
    --gold:#c79a9f;
    --line:rgba(43,38,34,0.12);

  html,body{
    background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");

    font-family:'Noto Serif KR',serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body{max-width:480px;margin:0 auto;position:relative;}
  img{max-width:100%;display:block;}
  section{padding:88px 32px;position:relative;}
  .divider{
    display:flex;align-items:center;justify-content:center;gap:10px;

  }
  .divider span{width:34px;height:1px;background:var(--ink);}
  .eyebrow{
    font-size:11px;letter-spacing:0.35em;color:var(--gold);
    font-family:'Noto Serif KR',serif;font-weight:500;margin-bottom:14px;
  }
  h2{font-size:22px;font-weight:500;line-height:1.5;margin-bottom:28px;}
  p{font-size:14px;line-height:1.9;color:#5a5148;}
   .center{text-align:center;}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity 0.7s ease, transform 0.7s ease;}
  .reveal.show{opacity:1;transform:translateY(0);}
  /* ---------- Hero ---------- */
  #hero{
    height:100svh;min-height:640px;padding:70px 32px 60px;
    display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
    position:relative;overflow:hidden;color:var(--ink);text-align:center;
    background:var(--paper);
  }
  #hero .content{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;}
  #hero .eyebrow{color:#a89c8a;margin-bottom:38px;}
  .frame{
    padding:14px;background:var(--white);box-shadow:0 1px 4px rgba(43,38,34,0.14);
    margin-bottom:40px;
  }
  .frame-inner{
    width:200px;height:264px;background:linear-gradient(160deg,#7a3b3e,#3c2a26);
    background-size:cover;background-position:center;
  }
  #hero h1{font-size:24px;font-weight:400;letter-spacing:0.2em;margin:0 0 16px;color:var(--ink);}
  #hero h1 .ring{font-size:13px;opacity:0.5;margin:0 12px;vertical-align:middle;}
  #hero .date{font-size:13px;letter-spacing:0.06em;color:#5a5148;margin-bottom:4px;}
  #hero .venue{font-size:12px;color:#a89c8a;font-family:'Gowun Batang',serif;}

  /* ---------- Greeting ---------- */
  #greeting p{white-space:pre-line;font-size:14px;line-height:2;}
  #greeting .names{margin-top:34px;padding-top:26px;border-top:1px solid var(--line);}
  #greeting .names p{font-size:15px;color:var(--ink);font-family:'Gowun Batang',serif;}
  #greeting .names b{font-weight:700;}
  #greeting .contact-btn{
    margin:30px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;
    width:fit-content;padding:12px 28px;border:1px solid var(--line);border-radius:999px;
    font-size:13px;background:none;color:var(--ink);cursor:pointer;font-family:'Noto Serif KR',serif;
  }

  /* ---------- Save the date ---------- */
  #savedate{background:var(--paper-soft);}
  #savedate .cal-head{font-size:32px;letter-spacing:0.12em;margin-bottom:6px;font-weight:400;}
  #savedate .cal-head b{font-weight:700;letter-spacing:0;}
  #savedate .cal-year{font-size:12px;letter-spacing:0.3em;color:#a89c8a;margin-bottom:30px;}
  .cal-rule{width:100%;height:1px;background:var(--line);margin:0 0 34px;}
  table.cal{width:100%;border-collapse:collapse;margin:0 0 34px;}
  table.cal th{font-size:12px;color:#c9a9a3;font-weight:500;padding-bottom:22px;}
  table.cal th:first-child{color:var(--wine);}
  table.cal td{text-align:center;font-size:14px;padding:11px 0;color:var(--ink);}
  table.cal td:first-child{color:#c9a9a3;}
  table.cal td.pick{position:relative;}
  table.cal td.pick:first-child{color:var(--white);}
  table.cal td.pick span{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;background:var(--wine);color:var(--white);font-weight:500;
  }
  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;}
  .countdown .box{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:20px 0;}
  .countdown .box b{display:block;font-size:24px;font-weight:400;}
  .countdown .box span{font-size:10px;letter-spacing:0.15em;color:#a89c8a;}
  .dday{margin-top:28px;font-size:13px;color:#5a5148;font-family:'Gowun Batang',serif;}
  .dday b{color:var(--wine);font-weight:700;}

  /* ---------- Gallery ---------- */
  #gallery{background:var(--paper-soft);padding-left:0;padding-right:0;}
  #gallery .head{padding:0 32px;}
  .gallery-scroll{display:flex;overflow-x:auto;gap:10px;padding:24px 32px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .gallery-scroll::-webkit-scrollbar{display:none;}
  .g-item{
    flex:0 0 auto;width:220px;height:290px;border-radius:6px;scroll-snap-align:start;
    display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.6);
    font-size:12px;background-size:cover;background-position:center;overflow:hidden;
  }

  /* ---------- Location ---------- */
  #location .venue-name{font-size:17px;font-family:'Gowun Batang',serif;margin-bottom:6px;}
  #location .venue-addr{font-size:13px;color:#8a8073;display:flex;align-items:center;justify-content:center;gap:6px;}
  #location .venue-addr button{border:none;background:none;color:#8a8073;cursor:pointer;font-size:13px;text-decoration:underline;}
  #map{width:100%;height:260px;border-radius:10px;margin:26px 0 14px;background:var(--paper-soft);}
  .nav-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .nav-buttons a{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;
    border:1px solid var(--line);border-radius:10px;background:var(--white);
    text-decoration:none;color:var(--ink);font-size:11px;
  }
  .nav-buttons .dot{width:26px;height:26px;border-radius:50%;background:var(--paper-soft);}

  /* ---------- Gift ---------- */
  #gift .tabs{display:flex;gap:8px;background:var(--paper-soft);padding:6px;border-radius:999px;margin-bottom:22px;}
  #gift .tabs button{
    flex:1;padding:11px 0;border:none;border-radius:999px;background:none;font-size:13px;
    font-family:'Noto Serif KR',serif;color:#8a8073;cursor:pointer;
  }
  #gift .tabs button.on{background:var(--white);color:var(--ink);}
  .acct-card{
    background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;
    margin-bottom:12px;
  }
  .acct-card .who{font-size:13px;color:#8a8073;margin-bottom:10px;}
  .acct-card .line{display:flex;align-items:center;justify-content:space-between;font-size:13px;}
  .acct-card .num{font-family:monospace;letter-spacing:0.02em;}
  .acct-card .copy{border:none;background:var(--paper-soft);border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--ink);margin-top:12px;width:100%;}

  /* ---------- Guestbook ---------- */
  #guestbook form{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
  #guestbook textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;min-height:80px;
    font-family:'Noto Serif KR',serif;font-size:14px;resize:vertical;background:var(--white);
  }
  .gb-list{margin-top:28px;display:flex;flex-direction:column;gap:12px;}
  .gb-item{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .gb-item .name{font-size:13px;font-weight:500;margin-bottom:4px;}
  .gb-item .msg{font-size:13px;color:#5a5148;line-height:1.7;white-space:pre-line;}
  .gb-item .date{font-size:10px;color:#a89c8a;margin-top:8px;}

  /* ---------- Footer ---------- */
  #footer{text-align:center;padding:60px 32px 80px;color:#a89c8a;}
  #footer .names{font-family:'Gowun Batang',serif;font-size:15px;color:var(--ink);margin-bottom:8px;}
  #footer .date{font-size:12px;margin-bottom:24px;}
  #footer .credit{font-size:10px;letter-spacing:0.05em;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:rgba(20,14,12,0.85);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:12px;opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:999;
  }
  .toast.show{opacity:1;}
</style>
</head>

<script>
/* ============================================================
   여기서부터가 실제로 수정하실 부분입니다.

const CONFIG = {

두 분만의 이야기를 담아 자유롭게 작성하시면 됩니다.
줄바꿈은 그대로 반영됩니다.`,

  // 계좌 — 더미 값입니다. bank/name/num을 실제 값으로 바꾸세요.
  accounts: {

      { who: '어머니', bank: 'OO은행', name: '어머니', num: '000-000-000000' },

    ],

      { who: '아버지', bank: 'OO은행', name: '아버지', num: '000-000-000000' },
      { who: '어머니', bank: 'OO은행', name: '어머니', num: '000-000-000000' },

  keys: {

/* ============================================================
   이 아래부터는 로직 코드입니다. 잘 모르시면 건드리지 마세요.
   ============================================================ */

// ---------- 초기 렌더 ----------
document.getElementById('hero-names').innerHTML =
  `${CONFIG.groom.name} <span class="ring">💍</span> ${CONFIG.bride.name}`;
document.getElementById('hero-date').textContent = CONFIG.wedding.dateText;
document.getElementById('hero-venue').textContent = `${CONFIG.venue.name}, ${CONFIG.venue.hall}`;
if(CONFIG.images.hero){

`;

document.getElementById('loc-addr').textContent = CONFIG.venue.address;

// ---------- Save the date ----------
(function renderCalendar(){
  const d = new Date(CONFIG.wedding.dateISO);
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  document.getElementById('cal-month').innerHTML = `<b>${m+1}</b>월`;
  document.getElementById('cal-year').textContent = y;

  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  let html = '<thead><tr>' + ['S','M','T','W','T','F','S'].map(w=>`<th>${w}</th>`).join('') + '</tr></thead><tbody><tr>';
  for(let i=0;i<first;i++) html += '<td></td>';
  for(let d2=1; d2<=days; d2++){
    if((first+d2-1)%7===0 && d2!==1) html += '</tr><tr>';
    html += d2===day ? `<td class="pick"><span>${d2}</span></td>` : `<td>${d2}</td>`;
  }
  html += '</tr></tbody>';
  document.getElementById('cal-table').innerHTML = html;
})();

function tick(){
  const now = new Date().getTime();
  const target = new Date(CONFIG.wedding.dateISO).getTime();
  const diff = target - now;
  const dayCount = Math.max(0, Math.ceil(diff/(1000*60*60*24)));
  document.getElementById('dday-text').innerHTML =
    diff > 0
      ? `${CONFIG.groom.name} ♥ ${CONFIG.bride.name}의 결혼식이 <b>D-${dayCount}</b> 남았습니다`
      : `${CONFIG.groom.name} ♥ ${CONFIG.bride.name}, 결혼했습니다`;
  const d = Math.max(0, Math.floor(diff/(1000*60*60*24)));
  const h = Math.max(0, Math.floor((diff/(1000*60*60))%24));
  const mi = Math.max(0, Math.floor((diff/(1000*60))%60));
  const s = Math.max(0, Math.floor((diff/1000)%60));
  document.getElementById('cd-d').textContent = d;
  document.getElementById('cd-h').textContent = h;
  document.getElementById('cd-m').textContent = mi;
  document.getElementById('cd-s').textContent = s;
}
tick(); setInterval(tick,1000);

// ---------- Toast / copy ----------

}

// ---------- Location: Naver map + nav buttons ----------
const venueQuery = encodeURIComponent(CONFIG.venue.name);

document.getElementById('btn-kakao').href = `https://map.kakao.com/link/map/${venueQuery},${CONFIG.venue.lat},${CONFIG.venue.lng}`;
document.getElementById('btn-tmap').addEventListener('click', function(e){
  e.preventDefault();
  const dest = { name: CONFIG.venue.name, lat: CONFIG.venue.lat, lon: CONFIG.venue.lng };
  function go(startLat,startLon){
    const appUrl = `tmap://route?goalname=${venueQuery}&goaly=${dest.lat}&goalx=${dest.lon}` + (startLat?`&starty=${startLat}&startx=${startLon}`:'');
    window.location.href = appUrl;
  }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos => go(pos.coords.latitude, pos.coords.longitude),
      () => go(null,null)
    );
  } else { go(null,null); }
});

(function loadNaverMap(){

// ---------- RSVP form state ----------
const rsvpState = { side:'', attend:'' };
function pickSeg(btn, key){
  const group = btn.parentElement;
  group.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  rsvpState[key] = btn.dataset.val;

// ---------- Firebase init ----------
firebase.initializeApp(CONFIG.keys.firebase);
const db = firebase.firestore();

async function submitRsvp(e){
  e.preventDefault();
  const msgEl = document.getElementById('rsvp-msg');
  const name = document.getElementById('rsvp-name').value.trim();
  const phone = document.getElementById('rsvp-phone').value.trim();
  const adult = parseInt(document.getElementById('rsvp-adult').value || '0',10);
  const child = parseInt(document.getElementById('rsvp-child').value || '0',10);

  if(!rsvpState.side || !rsvpState.attend || !name || phone.length!==4){
    msgEl.textContent = '모든 항목을 입력해주세요.';
    return;
  }
  try{
    const id = `${name}_${phone}`;
    await db.collection('rsvp').doc(id).set({
      guest: rsvpState.side, guest_name: name, guest_phone: phone,
      visited: rsvpState.attend, adult_count: adult, child_count: child,
      timestamp: firebase.firestore.Timestamp.now()
    });
    msgEl.style.color = 'var(--wine)';
    msgEl.textContent = '제출되었습니다. 감사합니다.';
    document.getElementById('rsvp-form').reset();
  }catch(err){
    msgEl.textContent = '오류가 발생했습니다. (Firestore 규칙/설정을 확인해주세요)';
    console.error(err);
  }
}

// ---------- Guestbook ----------
async function submitGuestbook(e){
  e.preventDefault();
  const status = document.getElementById('gb-status');
  const name = document.getElementById('gb-name').value.trim();
  const pw = document.getElementById('gb-pw').value.trim();
  const msg = document.getElementById('gb-msg').value.trim();
  if(!name || pw.length!==4 || !msg){
    status.textContent = '이름, 4자리 비밀번호, 메시지를 모두 입력해주세요.';
    return;
  }
  try{
    await db.collection('guestbook').add({
      name, password: pw, message: msg,
      createdAt: firebase.firestore.Timestamp.now()
    });
    status.textContent = '축하 메시지가 전달되었습니다.';
    document.getElementById('gb-form').reset();
    loadGuestbook();

// ---------- 스크롤 리빌 애니메이션 ----------
document.querySelectorAll('section').forEach(function(sec){
  Array.from(sec.children).forEach(function(el, i){
    el.classList.add('reveal');
    el.style.transitionDelay = (i * 0.09) + 's';
  });
});
const revealIO = new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    if(entry.isIntersecting){
      entry.target.classList.add('show');
      revealIO.unobserve(entry.target);
    }
  });
}, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
document.querySelectorAll('.reveal').forEach(function(el){ revealIO.observe(el); });
  }catch(err){
    status.textContent = '작업을 완료할 수 없습니다.';
    console.error(err);
  }
}

function loadGuestbook(){
  db.collection('guestbook').orderBy('createdAt','desc').limit(20).get().then(snap=>{
    const list = document.getElementById('gb-list');
    list.innerHTML = '';
    if(snap.empty){
      list.innerHTML = '<p class="center" style="font-size:13px;color:#a89c8a;">아직 작성된 방명록이 없습니다.</p>';
      return;
    }
    snap.forEach(doc=>{
      const d = doc.data();
      const item = document.createElement('div');
      item.className = 'gb-item';
      const date = d.createdAt ? d.createdAt.toDate().toLocaleDateString('ko-KR') : '';
      item.innerHTML = `<div class="name">${escapeHtml(d.name||'')}</div><div class="msg">${escapeHtml(d.message||'')}</div><div class="date">${date}</div>`;
      list.appendChild(item);
    });
  }).catch(err=>console.error(err));
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
loadGuestbook();
